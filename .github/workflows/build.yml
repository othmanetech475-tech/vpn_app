name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          ls -la
          ZIP="$(ls -t ./*.zip | head -n 1)"
          echo "Using: $ZIP"
          mkdir tmp
          unzip -q "$ZIP" -d tmp
          PUB="$(find tmp -name pubspec.yaml | head -n 1)"
          cp -r "$(dirname "$PUB")" src
          ls -la src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Generate android scaffold
        working-directory: src
        run: |
          flutter create --platforms=android --org com.example --project-name vpn /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          cp -r android_overrides/* android/
          python3 tools/patch_gradle.py android/app

      - name: Pub get
        working-directory: src
        run: flutter pub get

      - name: Build release APK
        working-directory: src
        run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: vpn-app-apk
          path: src/build/app/outputs/flutter-apk/app-release.apk
