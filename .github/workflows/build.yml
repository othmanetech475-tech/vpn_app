name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          mkdir tmp
          unzip -q vpn_app.zip -d tmp
          mv tmp/vpn_app src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Generate android scaffold
        working-directory: src
        run: |
          flutter create --platforms=android --org com.example --project-name vpn /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          cp -r android_overrides/* android/

      - name: Pub get
        working-directory: src
        run: flutter pub get

      - name: Build release APK
        working-directory: src
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: vpn-app-apk
          path: src/build/app/outputs/flutter-apk/app-release.apk
